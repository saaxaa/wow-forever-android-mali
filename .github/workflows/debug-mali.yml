name: Experimental Mali Debug APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, mali-system-vulkan]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.3.13750724' 'cmake;3.22.1'
      - name: Fetch and verify runtime components
        run: bash tools/fetch_components.sh
      - name: Configure SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build and test
        run: bash gradlew --no-daemon -PmaliSideBySide=true :app:assembleModernDebug :app:testModernDebugUnitTest --tests 'app.gamenative.ui.screen.wow.*'
      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Forever-Mali-ci-debug
          path: app/build/outputs/apk/modern/debug/*.apk
          if-no-files-found: error
      # Upstream currently has 10 unrelated errors; preserve the report without suppressing rules.
      - name: Lint report (known upstream findings)
        continue-on-error: true
        run: bash gradlew --no-daemon :app:lintModernDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WoW-Forever-Mali-build-reports
          path: |
            app/build/reports/tests/testModernDebugUnitTest/
            app/build/reports/lint-results-modernDebug.*
